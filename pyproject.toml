[project]
name = "company-name"
version = "0.1.0"
description = "Invented-word generator for brand and company names that sound natural to American English speakers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "gavrilov" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
company-name = "company_name:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
